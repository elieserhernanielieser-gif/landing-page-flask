<section class="max-w-6xl mx-auto px-8 py-20 border-t border-gray-800/60">
    
    <!-- Título da Secção -->
    <div class="text-center max-w-2xl mx-auto mb-16">
        <h2 class="text-3xl font-black text-white tracking-tight mb-3">PORQUÊ ESCOLHER A BETX?</h2>
        <p class="text-gray-400 text-sm">Desenvolvido com tecnologia de ponta para garantir máxima segurança e velocidade nas tuas apostas.</p>
    </div>

    <!-- Grelha de Features -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        {% for feature in features %}
        <div class="bg-gray-900/60 border border-gray-800 hover:border-green-500/40 p-8 rounded-2xl transition duration-300 group">
            
            <!-- Caixa do Ícone SVG -->
            <div class="w-12 h-12 bg-green-500/10 border border-green-500/20 text-green-500 rounded-xl flex items-center justify-center mb-6 group-hover:bg-green-500 group-hover:text-black transition duration-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="{{ feature.icon_d }}"></path>
                </svg>
            </div>

            <!-- Conteúdo -->
            <h3 class="text-xl font-bold text-white mb-3 group-hover:text-green-400 transition">{{ feature.title }}</h3>
            <p class="text-gray-400 text-sm leading-relaxed">{{ feature.desc }}</p>
        </div>
        {% endfor %}
    </div>

</section>
